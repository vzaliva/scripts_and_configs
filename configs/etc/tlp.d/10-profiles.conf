# /etc/tlp.d/10-profiles.conf - which TLP profile follows the power source
#
# 2 = switch when the charger is plugged or unplugged, unless a profile was
# picked by hand: plugging in switches to the AC profile only from the
# battery profile, and unplugging switches to the battery profile only from
# the AC profile. So balanced <-> performance follows the charger, while a
# hand-picked power-saver stays until it is changed by hand (travelling).
# With 1 every plug or unplug would override the manual choice.
TLP_AUTO_SWITCH=2

# PRF=performance, BAL=balanced, SAV=power-saver
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL
