# /etc/tlp.d/10-profiles.conf - which TLP profile follows the power source
#
# 1 = always switch when the charger is plugged or unplugged. The shipped
# default (2) keeps a hand-picked profile across a power source change, so
# plugging in while on power-saver would stay on power-saver.
TLP_AUTO_SWITCH=1

# PRF=performance, BAL=balanced, SAV=power-saver
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL
