# /etc/tlp.d/30-tuning.conf - per-profile CPU tuning
# _AC applies to the performance profile, _BAT to balanced, _SAV to
# power-saver.

# Fastest response when plugged in (shipped default: balance_performance).
CPU_ENERGY_PERF_POLICY_ON_AC=performance

# No core performance boost in power-saver, to make the battery last.
# Boost has no shipped default, so all three are set: with only _SAV=0
# it would stay off after switching back to another profile.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0
