# GeoClue 2.7.0 on Ubuntu 24.04 still points its Wi-Fi source at the
# Mozilla Location Service, which shut down in 2024, so every lookup times
# out. beaconDB serves the same API.
[wifi]
enable=true
url=https://api.beacondb.net/v1/geolocate

# Let redshift (redshift-gtk, started by i3) ask for the location directly:
# there is no GNOME Shell agent under i3 to authorise it.
[redshift]
allowed=true
system=true
users=
